[pytest]
minversion = 8.0
testpaths = tests
pythonpath = src
addopts = -ra -q --strict-markers -m "not live"
markers =
    unit: Fast unit tests running 100% offline without network dependencies
    adapter: Platform-specific measurement adapter tests using synthetic mocks
    integration: Workflow, orchestrator, and persistence integration tests
    lab: Isolated laboratory fault injection and safety gate tests
    live: Opt-in live tests executing real network probes (disabled by default)
filterwarnings =
    ignore::DeprecationWarning
